# Dev-mode override: bind-mounts source into the API and web containers (pdf-web,
# main-web) and
# runs their watch-mode dev servers, so an edit on the host is reflected
# without rebuilding or restarting anything.
#
# Usage (in addition to the base file, not instead of it):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# The `--build` matters the first time and after a `package.json` change —
# after that, editing source under backend/src or pdf-web/src needs neither
# `--build` nor a restart.
#
# node_modules is an anonymous volume, not bind-mounted, on both services.
# Without that, the container's Linux-built native binaries (Prisma's query
# engine, @node-rs/argon2) would be shadowed by whatever the host's
# `node_modules` contains — which on Windows is either absent or built for the
# wrong OS entirely, and the container would crash on startup.
#
# The catch: Docker keeps an anonymous volume when it *recreates* a container,
# so a rebuilt image's node_modules — new dependencies, a regenerated Prisma
# client after a schema change — stays hidden behind the old one. That is why
# `npm run docker:dev` passes `--renew-anon-volumes`: always start it that way,
# not with a bare `docker compose up`, which also skips this overlay file.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      # Application Default Credentials for STORAGE_DRIVER=gcs. Points at the
      # file inside the read-only gcloud config mount below; harmless when that
      # file does not exist and the driver is not gcs.
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/gcloud/application_default_credentials.json
    # `nest start --watch` compiles with `tsc --watch`, not chokidar, so its
    # file watching is controlled by tsconfig `watchOptions`, not
    # CHOKIDAR_USEPOLLING. tsconfig.docker.json turns on polling, which is what
    # actually makes edits on a Windows host reach this container.
    command: ["npx", "nest", "start", "--watch", "--path", "tsconfig.docker.json"]
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/tsconfig.json:/app/tsconfig.json
      - ./backend/tsconfig.build.json:/app/tsconfig.build.json
      - ./backend/tsconfig.docker.json:/app/tsconfig.docker.json
      - ./backend/nest-cli.json:/app/nest-cli.json
      # The host's gcloud config, read-only, so the GCS adapter has credentials.
      #
      # What those credentials are is the important part. Log in with
      # impersonation, so the container acts as `jsmf-local-dev` — a service
      # account holding Storage Object Admin on the two *dev* buckets and
      # nothing else:
      #
      #   gcloud auth application-default login       #     --impersonate-service-account=jsmf-local-dev@production-509708.iam.gserviceaccount.com
      #
      # Without `--impersonate-service-account` this mounts your personal
      # credentials instead, which on this project are Owner — handing a local
      # container full control of production to let it write two test buckets.
      # The flag is the whole point of the mount being safe.
      #
      # No key file, because the org policy `disableServiceAccountKeyCreation`
      # blocks downloadable keys — correctly: impersonated credentials expire
      # on their own, a leaked key does not.
      #
      # Set GCLOUD_CONFIG_DIR in a root `.env` — on Windows %APPDATA%\gcloud,
      # on macOS/Linux ~/.config/gcloud.
      - ${GCLOUD_CONFIG_DIR:-./.gcloud-not-configured}:/gcp/gcloud:ro
      - /app/node_modules

  pdf-web:
    build:
      context: ./pdf-web
      dockerfile: Dockerfile.dev
    env_file:
      - ./pdf-web/.env.local
    environment:
      # Turbopack (this project's default dev bundler) watches via native
      # filesystem events, which — like tsc's default watcher — don't reliably
      # propagate from a Windows-host bind mount into the container. Turbopack
      # has no polling fallback, so `--webpack` switches to the older bundler,
      # which does respect WATCHPACK_POLLING.
      WATCHPACK_POLLING: "true"
      BACKEND_API_URL: http://api:4000
    command: ["npx", "next", "dev", "-p", "3001", "--webpack"]
    volumes:
      - ./pdf-web/src:/app/src
      - ./pdf-web/public:/app/public
      - ./pdf-web/next.config.ts:/app/next.config.ts
      - ./pdf-web/tsconfig.json:/app/tsconfig.json
      - ./pdf-web/postcss.config.mjs:/app/postcss.config.mjs
      - ./pdf-web/components.json:/app/components.json
      - /app/node_modules
      - /app/.next

  main-web:
    build:
      context: ./main-web
      dockerfile: Dockerfile.dev
    env_file:
      - ./main-web/.env.local
    environment:
      # Same reason as pdf-web above: webpack + polling so edits on a Windows
      # host reach the container.
      WATCHPACK_POLLING: "true"
      BACKEND_API_URL: http://api:4000
    command: ["npx", "next", "dev", "-p", "3002", "--webpack"]
    volumes:
      - ./main-web/src:/app/src
      - ./main-web/public:/app/public
      - ./main-web/next.config.ts:/app/next.config.ts
      - ./main-web/tsconfig.json:/app/tsconfig.json
      - ./main-web/postcss.config.mjs:/app/postcss.config.mjs
      - /app/node_modules
      - /app/.next
