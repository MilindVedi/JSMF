# Local development dependencies only — not a production deployment.
# Start with `npm run db:up`, stop with `npm run db:down`.
#
# Port 5433 rather than the default 5432 so this cannot collide with a
# PostgreSQL already installed on the machine.

services:
  postgres:
    image: postgres:16-alpine
    container_name: jsmf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jsmf
      POSTGRES_PASSWORD: jsmf
      POSTGRES_DB: jsmf
    ports:
      - "5433:5432"
    volumes:
      - jsmf_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jsmf -d jsmf"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Off by default in the application: V1 sets REDIS_ENABLED=false and keeps
  # rate-limit counters in process memory, because Redis is a paid service in
  # production and nothing in V1 needs it.
  #
  # This container stays here so that flipping REDIS_ENABLED=true locally works
  # immediately with no infra work. It costs nothing while the app ignores it;
  # if you would rather not have it running at all, comment this service out —
  # the application does not connect to it unless REDIS_ENABLED=true.
  redis:
    image: redis:7-alpine
    container_name: jsmf-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - jsmf_redis_data:/data

volumes:
  jsmf_postgres_data:
  jsmf_redis_data:
