build:
  images:
  - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
  options:
    logging: CLOUD_LOGGING_ONLY
    substitutionOption: ALLOW_LOOSE
  steps:
  - args:
    - build
    - --no-cache
    - -t
    - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
    - .
    - -f
    - web/Dockerfile
    # BuildKit, so web/Dockerfile.dockerignore trims the repo-root context.
    env:
    - DOCKER_BUILDKIT=1
    id: Build
    name: gcr.io/cloud-builders/docker
  - args:
    - push
    - $_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
    id: Push
    name: gcr.io/cloud-builders/docker
  - args:
    - run
    - services
    - update
    - $_SERVICE_NAME
    - --platform=managed
    - --image=$_AR_HOSTNAME/$_AR_PROJECT_ID/$_AR_REPOSITORY/$REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA
    - --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID
    - --region=$_DEPLOY_REGION
    - --quiet
    entrypoint: gcloud
    id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  substitutions:
    REPO_NAME: jsmf
    _AR_HOSTNAME: asia-south1-docker.pkg.dev
    _AR_PROJECT_ID: production-509708
    _AR_REPOSITORY: cloud-run-source-deploy
    _DEPLOY_REGION: asia-south1
    _PLATFORM: managed
    _SERVICE_NAME: jsmf-web-pyqs
  tags:
  - gcp-cloud-build-deploy-cloud-run
  - gcp-cloud-build-deploy-cloud-run-managed
  - jsmf-web-pyqs
description: Build and deploy to Cloud Run service jsmf-web-pyqs on push to "main"
github:
  name: JSMF
  owner: MilindVedi
  push:
    branch: main
includedFiles:
- web/**
- packages/core/**
- package.json
- package-lock.json
name: jsmf-web-pyqs-deploy
